services:
  postgres:
    image: postgres:16-alpine
    container_name: subtitle-studio-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-subtitle_studio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.db_data/postgres:/var/lib/postgresql/data

# Note: Redis is NOT included here as we are reusing the existing host instance on 6379.
